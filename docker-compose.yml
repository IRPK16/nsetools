version: '3.8'

services:
  nse-api:
    image: python:3.11-slim
    container_name: nse_market_api
    ports:
      - "8000:8000"
    restart: always
    environment:
      - TZ=Asia/Kolkata
    # Bypasses all Git/SSH subprocess bugs by fetching a direct zip archive over HTTP
    entrypoint: >
      sh -c "
      apt-get update && apt-get install -y curl unzip && rm -rf /var/lib/apt/lists/* &&
      pip install --no-cache-dir fastapi==0.110.0 uvicorn==0.28.0 requests beautifulsoup4 &&
      curl -L https://github.com -o nse.zip &&
      unzip -q nse.zip &&
      mv nsetools-master/src/nsetools /usr/local/lib/python3.11/site-packages/ &&
      rm -rf nse.zip nsetools-master &&
      echo '' | base64 -d > /app.py &&
      uvicorn app:app --host 0.0.0.0 --port 8000
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
