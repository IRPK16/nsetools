version: '3.8'

services:
  nse-api:
    image: python:3.11-slim
    container_name: nse_market_api
    ports:
      - "8000:8000"
    restart: always
    environment:
      - TZ=Asia/Kolkata
    # Bypasses string stripping bugs by executing a secure encoded payload block
    entrypoint: >
      sh -c "
      apt-get update && apt-get install -y git curl && rm -rf /var/lib/apt/lists/* &&
      pip install --no-cache-dir fastapi==0.110.0 uvicorn==0.28.0 &&
      pip install --no-cache-dir git+https://github.com &&
      echo '' | base64 -d > /app.py &&
      uvicorn app:app --host 0.0.0.0 --port 8000
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
